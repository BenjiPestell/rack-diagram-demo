inter_rack_distance: 2.5
cable_slack_length: 0.2
front_to_back_length: 0.5
rail_extension_length: 0.5
standard_u_height: 0.045

cable_types:
  - Ethernet
  - Fibre
  - HDMI
  - SDI
  - XLR
  - USB
  - C13-C14

type_colors:
  Switch:
    color: "#1f6feb"
  Patch panel:
    color: "#388bfd"
    ported: true
  Server:
    color: "#2ea043"
    units: 2
  PDU:
    color: "#d29922"
  UPS:
    color: "#6e40c9"
    units: 2
  KVM:
    color: "#bf4b8a"
  Media:
    color: "#1b7c83"
  Encoder:
    color: "#c0392b"
  Decoder:
    color: "#2980b9"
  Controller:
    color: "#8e44ad"

racks:
  - rack:
      id: rack1
      name: Rack 1
      total_u: 42
    front:
      - name: Switch 1
        type: Switch
        start_u: 42
        units: 1
      - name: Operator
        type: Server
        start_u: 35
        units: 2
        ports: 1
    rear:
      - name: PDU 1
        type: PDU
        start_u: 42
        units: 1

wiring_layers:
  - name: Visuals network
    edge_color: "#e74c3c"
    cable_type: Ethernet
    connections:
      - from: Operator
        to: Switch 1
        from_port: 1
        to_port: 1
        from_ip: 192.168.2.80
  - name: Power
    edge_color: "#333333"
    cable_type: C13-C14
    connections:
      - from: PDU 1
        to: Switch 1
      - from: PDU 1
        to: Operator