external_devices:
  - name: Projectors
    distance_from_racks: 30
    devices:
      - name: "Projector {N}"
        type: projector
        start: 1
        end: 13
  - name: Operator room
    distance_from_racks: 20
    devices:
      - name: "Operator beltpack {N}"
        type: beltpack
        start: 1
        end: 5
  - name: Chassis
    distance_from_racks: 30
    devices:
      - name: Driver beltpack
        type: beltpack
      - name: "Driver RVD {N}"
        type: mirror display
        start: 1
        end: 3
  - name: chassis media converters
    distance_from_racks: 20
    devices:
      - name: Audio fibre converter
        type: fibre converter
  - name: MCP Cabinet
    distance_from_racks: 25
    devices:
      - name: Ethercat drives
        type: pc

wiring_layers:
  - name: Visuals Subnet
    edge_color: "#b551a9"
    cable_type: Ethernet
    connections:
      - from: "Graphics Switch {N}"
        to: "Graphics Switch {N+1}"
        start: 1
        end: 3
        via_patch_from: "R{N} Patch panel"
        via_patch_to: "R{N+1} Patch panel"
      - from: Graphics Switch 1
        to: "Operator PC, Physics PC, Spectator IG, Telemetry, dSPACE"
        to_port: 1
        to_ip: 192.168.2.81
      - from: Graphics Switch 2
        to: "RVD {N}"
        start: 1
        end: 3
        to_ip: "192.168.2.{50+N}"
      - from: Graphics Switch 2
        to: "IG {N}"
        start: 1
        end: 2
        to_ip: "192.168.2.{50+N}"
      - from: Graphics Switch 3
        to: "IG {N}"
        start: 3
        end: 7
      - from: Graphics Switch 4
        to: "IG {N}"
        start: 8
        end: 13
  - name: Power Distribution
    edge_color: "#292929"
    cable_type: C13-C14
    connections:
      - from: UPS
        to: "KVM Shelf {N}"
        start: 1
        end: 3
      - from: R1 16A PDU B
        to: "Operator PC, Physics PC, Spectator IG"
      - from: R1 16A PDU C
        to: "Telemetry, dSPACE Controller, dSPACE, Graphics Switch 1"
      - from: Mains in 1
        to: Vertical PDU 1
      - from: Vertical PDU 1
        to: "R1 16A PDU A, R1 16A PDU B, R1 16A PDU C"
      - from: Vertical PDU 1
        to: UPS
      - from: R1 16A PDU A
        to: "Company Network Switch, CCTV Switch, Audio Switch"
      - from: R2 16A PDU A
        to: Customer 2
      - from: R2 16A PDU B
        to: "RVD {N}"
        start: 1
        end: 3
      - from: R2 16A PDU C
        to: "IG {N}"
        start: 1
        end: 2
      - from: Mains in 2
        to: Vertical PDU 2
      - from: Vertical PDU 2
        to: "R2 16A PDU A, R2 16A PDU B, R2 16A PDU C"
      - from: R2 16A PDU C
        to: Graphics Switch 2
      - from: R3 16A PDU A
        to: Customer 3
      - from: R3 16A PDU B
        to: "IG {N}"
        start: 3
        end: 5
      - from: R3 16A PDU C
        to: "IG {N}"
        start: 6
        end: 7
      - from: Mains in 3
        to: Vertical PDU 3
      - from: Vertical PDU 3
        to: "R3 16A PDU A, R3 16A PDU B, R3 16A PDU C"
      - from: R3 16A PDU C
        to: Graphics Switch 3
      - from: R4 16A PDU A
        to: Customer 4
      - from: R4 16A PDU B
        to: "IG {N}"
        start: 8
        end: 10
      - from: R4 16A PDU C
        to: "IG {N}"
        start: 11
        end: 13
      - from: Mains in 4
        to: Vertical PDU 4
      - from: Vertical PDU 4
        to: "R4 16A PDU A, R4 16A PDU B, R4 16A PDU C"
      - from: R4 16A PDU C
        to: Graphics Switch 4
  - name: Host Subnet
    edge_color: "#5192b5"
    cable_type: Ethernet
    connections:
      - from: Operator PC
        to: dSPACE Controller
        from_ip: 192.168.3.1
      - from: dSPACE Controller
        to: dSPACE
  - name: Company Network
    edge_color: "#292929"
    cable_type: Ethernet
    connections:
      - from: Company Network Switch
        to: Telemetry
      - from: Company Net in
        to: Company Network Switch
        via_patch_to: R1 Patch panel
      - from: Company Network Switch
        to: Operator PC
        to_port: 4
        to_ip: DHCP
  - name: Video
    edge_color: "#ffb35c"
    cable_type: Display Port
    connections:
      - from: "IG {N}"
        to: "Projector {N}"
        start: 1
        end: 13
      - from: "RVD {N}"
        to: "Driver RVD {N}"
        start: 1
        end: 3
  - name: Intercom
    edge_color: "#ffff00"
    cable_type: Ethernet
    connections:
      - from: Spectator IG
        to: 4-wire interface
        cable_type: 3.5mm to XLR4
        edge_color: "#4d4d4d"
      - from: Audio Switch
        to: "Operator beltpack {N}"
        start: 1
        end: 5
      - from: Media Converters
        to: Audio fibre converter
        cable_type: Fibre
        edge_color: "#ffffb8"
      - from: Audio fibre converter
        to: Driver beltpack
      - from: Audio Switch
        to: Media Converters
        from_port: 7
      - from: 4-wire interface
        to: Audio Switch
  - name: EtherCAT
    edge_color: "#6678ff"
    cable_type: Ethernet
    connections:
      - from: dSPACE
        to: Ethercat drives
        via_patch_from: R1 Patch panel